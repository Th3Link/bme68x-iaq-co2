[package]
name = "bme68x-iaq-co2"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["Marc-Hendric Luehr <marc@luehr.dev>"]
description = "Open indoor air quality index, breath-VOC and CO2 equivalents from a Bosch BME680/BME688 gas sensor, without BSEC"
documentation = "https://docs.rs/bme68x-iaq-co2"
repository = "https://github.com/Th3Link/bme68x-iaq-co2"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["bme680", "bme688", "iaq", "air-quality", "no-std"]
categories = ["embedded", "no-std", "science"]
exclude = [".github/"]

[features]
default = []
# `From<&bme68x::Measurement>` for `Sample` (without the time stamp).
bme68x = ["dep:bme68x"]

[dependencies]
libm = "0.2.16"
bme68x = { version = "0.2", default-features = false, optional = true }

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Sensor values are small; the casts between f32 and integers are checked
# where they matter.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
